<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — PeerSphere</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <h1>🎓 PeerSphere</h1>
            <p>Collaborative Learning Platform</p>
        </div>

        <h2 class="auth-title">Welcome back</h2>
        <p class="auth-subtitle">Sign in to continue learning</p>

        <div id="alert-container"></div>

        <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="email" class="form-control"
                   placeholder="you@example.com">
        </div>

        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control"
                   placeholder="Enter your password">
        </div>

        <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;"
                id="login-btn" onclick="handleLogin()">
            Sign In
        </button>

        <div class="auth-footer">
            Don't have an account?
            <a href="register.html">Create one free</a>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script>
    // If already logged in, redirect to dashboard
    if (localStorage.getItem('token')) {
        window.location.href = 'dashboard.html';
    }

    async function handleLogin() {
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn      = document.getElementById('login-btn');

        if (!email || !password) {
            showAlert('alert-container', 'Please fill in all fields');
            return;
        }

        btn.textContent = 'Signing in...';
        btn.disabled = true;

        try {
            const data = await AuthAPI.login({ email, password });
            saveAuth(data);
            window.location.href = 'dashboard.html';
        } catch (err) {
            showAlert('alert-container', err.message || 'Invalid email or password');
            btn.textContent = 'Sign In';
            btn.disabled = false;
        }
    }

    // Allow Enter key to submit
    document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
    });
</script>
</body>
</html>
