# =========================================================
# Application
# =========================================================
spring.application.name=peersphere


# =========================================================
# Database - Railway MySQL
# =========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# =========================================================
# Server
# =========================================================
# Railway automatically provides PORT.
server.port=${PORT:8081}


# =========================================================
# CORS
# =========================================================
# Comma-separated allowed frontend origins. Defaults to the
# built-in list in SecurityConfig when not set.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}


# =========================================================
# JWT
# =========================================================
app.jwt.secret=${APP_JWT_SECRET:PeerSphereSecretKey2024SuperLongSecretKeyForHS256AlgorithmMinimum256Bits}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}


# =========================================================
# Google Calendar
# =========================================================
google.calendar.credentials-file=classpath:google-credentials.json
google.calendar.application-name=PeerSphere
google.calendar.calendar-id=primary